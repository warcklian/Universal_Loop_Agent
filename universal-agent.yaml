project:
  name: "Universal Loop Agent"
  description: "Universal agent config generator — auto-adapts to any project stack"
  stack:
    languages: [typescript]
    runtime: [bun]
    package_managers: [bun]

build:
  install: "bun install"
  dev: "bun run dev"
  build: "bun run build"
  lint: "bun run lint"
  typecheck: "bun run typecheck"

testing:
  unit: "bun test"
  e2e: "bun test:e2e"
  coverage: "bun test:coverage"

code_style:
  indent: 2
  quotes: double
  semicolons: true
  max_line_length: 100
  conventions:
    - "Use TypeScript strict mode"
    - "Prefer functional patterns over classes"
    - "Keep functions small and focused"
    - "Use descriptive variable and function names"

security:
  rules:
    - "Never commit secrets or API keys"
    - "Validate all user input"
    - "Use environment variables for configuration"

git:
  commit_format: conventional
  branch_format: "{type}/{ticket}-{description}"
  rules:
    - "Write meaningful commit messages"
    - "Keep commits atomic and focused"

agent_loop:
  enabled: true
  max_iterations: 15
  timeout_seconds: 300
  doom_loop_detection: true
  rules:
    - instruction: "Carga AGENTS.md en el chat para activar el modo loop; sin él se trabaja en modo prompt (sin bucle automático)."
      description: "Activación del bucle"
    - instruction: "Al iniciar la sesión lee PROJECT_MEMORY.md, luego idea.md / plan.md y universal-agent.yaml. El disco es la fuente de verdad y el punto de reanudación."
      description: "Memoria portable antes de actuar"
    - instruction: "Lee el historial del chat y los comentarios previos antes de actuar, para tener todo el contexto de lo ya conversado y no repetir ni omitir nada."
      description: "Leer historial de chat antes de actuar"
    - instruction: "Nunca edites un archivo sin leerlo primero y entender su estado actual."
      description: "Leer antes de editar"
    - instruction: "Ejecuta una acción, observa el resultado real y adapta el siguiente paso (ciclo cerrado: actuar → observar → adaptar)."
      description: "Ejecución real con observación"
    - instruction: "Si una solución falla, no la repitas indefinidamente: identifica la causa, busca alternativas y elige una prueba que las distinga."
      description: "Replanificación ante fallos"
    - instruction: "Tras cada cambio sustancial ejecuta las pruebas, el linter y el type checker del proyecto."
      description: "Verificar tras cada cambio"
    - instruction: "Si no hay progreso en 3 iteraciones, detente y pregunta al usuario (detección de bucle sin salida)."
      description: "Doom loop"
    - instruction: "No pidas al usuario que diga 'continue' entre fases exitosas; avanza hasta completar la entrega o hasta quedar bloqueado."
      description: "Entrega autónoma por fases"
    - instruction: "Explica qué cambiaste y por qué al finalizar cada fase y al completar la entrega."
      description: "Informe de cambios"
    - instruction: "Registra cada cambio autorizado en CHANGE_CONTROL.md (fila, fecha, alcance, estado authorized) y documenta en detalle antes de escribir código: qué, por qué, archivos, pasos, aceptación y verificación. Sin fila y sin documentación, no hay código."
      description: "Puerta de control de cambios"
    - instruction: "Cierra una fase solo cuando: código implementado + pruebas de la fase pasan + PROJECT_MEMORY.md marca la fase [x] con las rutas tocadas."
      description: "Definición de hecho por fase"

multi_agent:
  enabled: true
  memory:
    enabled: true
    path: ".uagent/memory/"
    auto_sync: true
    canonical_file: "PROJECT_MEMORY.md"
  ownership:
    - agent: "core"
      globs: ["src/schema.ts", "src/parser.ts", "src/generator.ts", "src/cli.ts", "src/detector.ts"]
    - agent: "sections"
      globs: ["src/sections/**"]
      integrator: true
  conflict:
    file_locking: true
    auto_detect: true
    strategy: topological
    lock_ttl_minutes: 30
    locks_path: ".uagent/locks"
  orchestration:
    parallel: true
    shared_memory: "PROJECT_MEMORY.md"
    avoid_new_files: true
    agents_share_state: true

change_control:
  enabled: true
  file: "CHANGE_CONTROL.md"
  id_prefix: "CH"
  rules:
    - "El ID es secuencial y nunca se reusa (CH-0001, CH-0002, …)."
    - "Cierra la fila solo cuando el código está en su lugar, las pruebas pasan y la documentación coincide con el comportamiento implementado (implemented → verified)."
    - "Registra los archivos tocados y la verificación usada."

research:
  enabled: true
  methodology: "Antes de implementar plan.md investiga si la metodología, el lenguaje y el framework propuestos son la mejor opción para entregar un producto de calidad, rápido y escalable. No implementes a ciegas."
  investigator_mark: "Cada investigación debe marcar qué modelo/agente la realizó para que todos los agentes sepan quién la hizo."
  cross_validation: "Otro agente que lea la investigación puede verificarla y dar su visto bueno si concuerda, o aportar retroalimentación con mejoras que el investigador no propuso ni dio por sentadas."
  functional_proof: "Una investigación solo se da por buena si la solución resultante es funcional, no solo válida sobre el papel."

validation:
  enabled: true
  closed_phase_review: "Verifica lo ya cerrado: ¿está bien hecho? ¿algún agente omitió algo? Una fase cerrada no se asume correcta por defecto."
  functional_not_just_validated: "Si dos o más agentes validaron y coincidieron en que la metodología y lo implementado es la mejora alternativa y es funcional (no solo validado), entonces se da por cerrado; aun así no se omite de revisión cuando el usuario pide un análisis del sistema o se ejecuta AGENTS.md en otro agente."
  independent_verifier: "El agente no es el único juez de su propio éxito; las pruebas y criterios de aceptación deben ser comprobables por un mecanismo independiente."

context_preservation:
  enabled: true
  mode: "complement_or_update"
  never_overwrite: true
  protected_files:
    - "AGENTS.md"
    - "PROJECT_MEMORY.md"
    - "CHANGE_CONTROL.md"
    - "idea.md"
    - "plan.md"
    - "Universal_Loop_Agent_Plan.md"
  rule: "Cuando se ejecuten los .bat (init.bat, setup-all.bat, generate.bat) revisa ANTES si esos archivos ya existen. Nunca los reemplaces por versiones nuevas solo porque sí. Complementa o actualiza lo que ya existe; si no existe, créalo. Nunca pierdas el contexto del avance por una sobrescritura."

rules:
  - name: "Schema Types"
    glob: "src/schema.ts"
    instructions: |
      Single source of truth for all types.
      All other files must import from here.
      Never duplicate type definitions.

  - name: "Section Generators"
    glob: "src/sections/**"
    instructions: |
      Each section function returns string | null.
      Return null if the section has no content.
      Never return empty strings.

  - name: "Generator"
    glob: "src/generator.ts"
    instructions: |
      Orchestrates all sections into a single AGENTS.md.
      Sections are joined with double newlines.
      Never modify the output format — consumers depend on it.

universal_instructions: |
  Universal Loop Agent (ULA). Este AGENTS.md activa el modo loop autónomo y adaptativo al cargarse en el chat de cualquier editor de IA. No necesitas pegar ningún prompt adicional: al cargar AGENTS.md las reglas y el start prompt se inyectan automáticamente.

  1. Universal: funciona con cualquier modelo LLM y editor (OpenCode, Cursor, Copilot, Claude Code, Windsurf, Devin, Jules, Zed, Amp, Roo Code, Kilo Code, Cline, Gemini CLI, etc.). No requiere cuentas ni herramientas externas más allá de las del editor.
  2. Adaptativo: se adapta al proyecto que se esté implementando. Detecta el stack, la fase actual, qué está cerrado y qué está abierto, y ajusta la metodología al producto, no al conocimiento del agente.
  3. Plan en fases: implementa plan.md fase por fase, pero siempre verifica lo ya cerrado y si algún agente omitió algo.
  4. Cierre basado en evidencia: una fase cerrada requiere código, pruebas que pasen y PROJECT_MEMORY.md marcado. Si 2+ agentes coinciden en que lo implementado es funcional (no solo validado), se da por cerrado, sin omitirlo de revisión cuando el usuario lo pida o otro agente ejecute AGENTS.md.
  5. Calidad, rapidez, escalabilidad: investiga de forma autónoma la mejor metodología, lenguaje y framework antes de implementar.
  6. Investigación con autoría: marca qué modelo hizo la investigación; otro agente puede verificarla, dar el visto bueno o aportar retroalimentación con mejoras no propuestas.
  7. Preservación de contexto: los .bat nunca reemplazan archivos existentes solo porque sí. Al ejecutar init.bat, setup-all.bat o generate.bat, se comprueba si AGENTS.md, PROJECT_MEMORY.md, CHANGE_CONTROL.md, idea.md y plan.md ya existen; si existen, se actualizan solo si hace falta (contenido cambiado) y se conserva todo el contexto previo. Si no existen, se crean.
  8. Orquestación paralela: varios agentes trabajan en conjunto sabiendo qué hace el otro, coordinados por PROJECT_MEMORY.md (memoria permanente), sin archivos orquestador innecesarios.

  Edita universal-agent.yaml para configurar todo. Ejecuta `uagent generate` para regenerar AGENTS.md. Cárgalo en el chat para activar el modo loop.
